{% extends "base.html" %}

{% block title %}
Party Planner - PocketSmart AI
{% endblock %}

{% block content %}

<div class="planner-page">

    <div class="page-header">

        <h1>🎉 Party Planner</h1>

        <p>
            Plan your event while keeping your spending
            within your selected budget.
        </p>

    </div>


    <div class="form-card">

        <form action="/generate-party" method="post">

            <label for="budget">
                Your Budget (₹)
            </label>

            <input
                type="number"
                id="budget"
                name="budget"
                min="1"
                step="1"
                placeholder="Example: 50000"
                required
            >


            <label for="event_type">
                Event Type
            </label>

            <select
                id="event_type"
                name="event_type"
                required
            >

                <option value="">
                    Select an event
                </option>

                <option value="Birthday Party">
                    Birthday Party
                </option>

                <option value="Wedding">
                    Wedding
                </option>

                <option value="Engagement">
                    Engagement
                </option>

                <option value="Anniversary">
                    Anniversary
                </option>

                <option value="Family Function">
                    Family Function
                </option>

                <option value="Corporate Event">
                    Corporate Event
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label for="guests">
                Number of Guests
            </label>

            <input
                type="number"
                id="guests"
                name="guests"
                min="1"
                placeholder="Example: 50"
                required
            >


            <label for="location">
                Event Location
            </label>

            <input
                type="text"
                id="location"
                name="location"
                placeholder="Example: Chennai"
                required
            >


            <label for="requirements">
                Additional Requirements
            </label>

            <textarea
                id="requirements"
                name="requirements"
                rows="5"
                placeholder="Example: Need vegetarian food, decoration, music and photography."
            ></textarea>


            <button
                type="submit"
                class="btn full-width"
            >
                ✨ Generate Party Plan
            </button>

        </form>

    </div>

</div>

{% endblock %}
