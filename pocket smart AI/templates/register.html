{% extends "base.html" %}

{% block title %}
Create Account - PocketSmart AI
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Your Account</h1>

        <p class="auth-subtitle">
            Join PocketSmart AI and start planning your budget.
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form action="/register" method="post">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >

            <button type="submit" class="btn full-width">
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="/login">Login here</a>
        </p>

    </div>

</div>

{% endblock %}
