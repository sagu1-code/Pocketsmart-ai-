{% extends "base.html" %}

{% block title %}
Login - PocketSmart AI
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to your PocketSmart AI account.
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="post">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="btn full-width">
                Login
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="/register">Create an account</a>
        </p>

    </div>

</div>

{% endblock %}
